name: Build EasyControl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./easycontrol/gradlew

      - name: Build server APK
        run: ./easycontrol/gradlew :server:assembleDebug
        working-directory: ./easycontrol

      - name: Copy server APK to app raw resources
        run: ./easycontrol/gradlew :server:copyDebug
        working-directory: ./easycontrol

      - name: Build app APK
        run: ./easycontrol/gradlew :app:assembleDebug
        working-directory: ./easycontrol

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: easycontrol-debug-apks
          path: |
            easycontrol/server/build/outputs/apk/debug/server-debug.apk
            easycontrol/app/build/outputs/apk/debug/*.apk
          retention-days: 30
