name: Build EasyControl

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./easycontrol/gradlew

      - name: Build server APK
        run: cd easycontrol && ./gradlew :server:assembleDebug

      - name: Copy server APK to app raw resources
        run: cd easycontrol && ./gradlew :server:copyDebug

      - name: Build app APK
        run: cd easycontrol && ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: easycontrol-debug-apks
          path: |
            easycontrol/server/build/outputs/apk/debug/server-debug.apk
            easycontrol/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          files: |
            easycontrol/server/build/outputs/apk/debug/server-debug.apk
            easycontrol/app/build/outputs/apk/debug/*.apk
          tag_name: v${{ github.run_number }}
          name: Build #${{ github.run_number }}
          body: |
            ## Build #${{ github.run_number }}
            
            Auto-built from commit ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
